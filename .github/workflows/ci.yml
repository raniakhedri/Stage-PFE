name: CI

# Every push and pull request: build and test the three parts of Sellio, then build the Docker images.
# On main, the images are published to GitHub Container Registry (ghcr.io).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Maven build + JUnit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: microservices
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build all services and run the tests
        run: mvn -B -ntp verify
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: microservices/**/target/surefire-reports/*.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · Vitest + production builds
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (storefront + backoffice)
        run: npm test
      - name: Build the storefront
        run: npx vite build
      - name: Build the backoffice
        run: npm run build --workspace=backoffice

  ml:
    name: Machine learning · pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: microservices/analytics-service/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: microservices/analytics-service/python/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Recommender, segmentation and churn models
        run: python -m pytest -q tests

  docker:
    name: Docker · ${{ matrix.name }}
    needs: [backend, frontend, ml]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service, context: microservices, target: service, args: "SERVICE=auth-service" }
          - { name: catalog-service, context: microservices, target: service, args: "SERVICE=catalog-service" }
          - { name: order-service, context: microservices, target: service, args: "SERVICE=order-service" }
          - { name: marketing-service, context: microservices, target: service, args: "SERVICE=marketing-service" }
          - { name: analytics-service, context: microservices, target: analytics, args: "SERVICE=analytics-service" }
          - { name: api-gateway, context: microservices, target: service, args: "SERVICE=api-gateway" }
          - { name: storefront, context: Frontend, target: '', args: "APP=storefront" }
          - { name: backoffice, context: Frontend, target: '', args: "APP=backoffice" }
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ env.PUBLISH == 'true' && ' and publish' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.args }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sellio-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/sellio-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
