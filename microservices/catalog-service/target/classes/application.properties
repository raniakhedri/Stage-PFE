
### Catalog Service Configuration (port 8082)
server.port=8082
spring.application.name=catalog-service

### Shared secrets: microservices/.env (git-ignored). Real environment variables still win.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

### Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/naturessence
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

### JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars-change-in-production-123456}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

### Application Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Africa/Tunis
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

### Decart realtime try-on (permanent key never leaves this service)
decart.api-key=${DECART_API_KEY:}
decart.api-url=${DECART_API_URL:https://api.decart.ai}
decart.session-seconds=${DECART_SESSION_SECONDS:45}
