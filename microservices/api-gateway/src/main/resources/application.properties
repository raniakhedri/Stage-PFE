### API Gateway Configuration (port 8080)
server.port=8080
spring.application.name=api-gateway

### Reactive web application (required for Spring Cloud Gateway)
spring.main.web-application-type=reactive

### Disable DataSource / JPA / Redis auto-configuration (gateway has no DB)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

### Routes: see ApiGatewayApplication.routes (service addresses come from *_SERVICE_URL variables)

### Global CORS (applied at gateway level before routing)
spring.codec.max-in-memory-size=16MB
spring.cloud.gateway.httpclient.max-header-size=32KB

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8080}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
