### API Gateway Configuration (port 8080)
server.port=8080
spring.application.name=api-gateway

### Reactive web application (required for Spring Cloud Gateway)
spring.main.web-application-type=reactive

### Disable DataSource / JPA / Redis auto-configuration (gateway has no DB)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

### Route definitions (duplicated in ApiGatewayApplication.java Java bean)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/profile,/api/v1/profile/loyalty,/api/v1/profile/loyalty/**,/api/v1/profile/cart,/api/v1/profile/cart/**,/api/v1/admin/users/**,/api/v1/admin/roles/**,/api/v1/admin/segments/**,/api/v1/admin/loyalty/**

spring.cloud.gateway.routes[1].id=catalog-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/public/products/**,/api/v1/public/categories/**,/api/v1/public/collections/**,/api/v1/public/reviews/**,/api/v1/profile/reviews,/api/v1/profile/reviews/**,/api/v1/reviews/**,/api/v1/admin/products,/api/v1/admin/products/**,/api/v1/admin/categories,/api/v1/admin/categories/**,/api/v1/admin/collections,/api/v1/admin/collections/**,/api/v1/admin/reviews,/api/v1/admin/reviews/**,/api/v1/admin/upload/**,/uploads/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/public/checkout/**,/api/v1/public/stripe/**,/api/v1/public/coupons/**,/api/v1/public/return-policy/**,/api/v1/profile/orders,/api/v1/profile/orders/**,/api/v1/profile/returns,/api/v1/profile/returns/**,/api/v1/admin/orders,/api/v1/admin/orders/**,/api/v1/admin/returns,/api/v1/admin/returns/**,/api/v1/admin/tva-shipping/**,/api/v1/admin/promotions/**,/api/v1/admin/dashboard/**

spring.cloud.gateway.routes[3].id=marketing-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/public/banners/**,/api/v1/public/appearance/**,/api/v1/admin/banners/**,/api/v1/admin/appearance/**,/api/v1/admin/email/**

spring.cloud.gateway.routes[4].id=analytics-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/analytics/**

### Global CORS (applied at gateway level before routing)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:8080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
