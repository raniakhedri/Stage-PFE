
### Marketing Service Configuration (port 8084)
server.port=8084
spring.application.name=marketing-service

### Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/naturessence
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

### JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars-change-in-production-123456}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

