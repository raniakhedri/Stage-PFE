### Analytics Service Configuration (port 8085)
server.port=8085
spring.application.name=analytics-service

### Shared secrets: microservices/.env (git-ignored). Real environment variables still win.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

### Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/naturessence
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

### JWT (must match the secret used by auth-service)
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars-change-in-production-123456}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

### Application
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Africa/Tunis

### Churn model (Python subprocess)
churn.python-command=${CHURN_PYTHON:python}
