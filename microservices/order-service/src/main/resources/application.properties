
### Order Service Configuration (port 8083)
server.port=8083
spring.application.name=order-service

### Shared secrets: microservices/.env (git-ignored). Real environment variables still win.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

### Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:naturessence}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

### JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars-change-in-production-123456}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

### Stripe Configuration
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

### Brevo Email Configuration
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Sellio}
brevo.reply-to=${BREVO_REPLY_TO:}

### Application Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Africa/Tunis
